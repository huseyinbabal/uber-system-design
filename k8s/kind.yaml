kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: uber
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 8088, protocol: TCP }
      - { containerPort: 1024, hostPort: 1024, protocol: TCP }
  - role: worker
  - role: worker
